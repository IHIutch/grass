name: Release napi

on:
  push:
    tags: ["napi-v*"]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-14
            node-suffix: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-14
            node-suffix: darwin-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            node-suffix: linux-x64-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            node-suffix: linux-x64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            node-suffix: linux-arm64-gnu
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            node-suffix: linux-arm64-musl
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            node-suffix: win32-x64-msvc

    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # v1, resolves 1.97.0
        with:
          toolchain: "1.97.0" # pinned stable — bump deliberately
          targets: ${{ matrix.target }}

      - name: Install dependencies
        if: ${{ !contains(matrix.target, 'musl') }}
        working-directory: crates/napi
        run: npm ci

      - name: Build native module
        if: ${{ !contains(matrix.target, 'musl') }}
        working-directory: crates/napi
        run: npx napi build --platform --profile release-napi --target ${{ matrix.target }}

      - name: Build native module (musl container)
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          image="grass-rust-musl:${{ matrix.target }}"
          context="$RUNNER_TEMP/grass-rust-musl-context"
          mkdir -p "$context"
          docker build --tag "$image" --file - "$context" <<'DOCKERFILE'
          FROM rust:1.97-alpine@sha256:ec9c91e77119ce498cd1e87d96d77e0f75b2cee21655a29bc2bf75a51a2b20a4
          RUN apk add --no-cache nodejs npm build-base libgcc
          ENV RUSTFLAGS="-C target-feature=-crt-static"
          DOCKERFILE
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env npm_config_cache=/tmp/npm-cache \
            -v "$PWD:/w" \
            -w /w/crates/napi \
            "$image" \
            sh -c "npm ci && npx napi build --platform --profile release-napi --target ${{ matrix.target }}"

      - name: Verify musl linkage
        if: contains(matrix.target, 'musl')
        working-directory: crates/napi
        run: |
          if readelf -d grass.*.node | grep -q "ld-linux"; then
            echo "ERROR: musl artifact references the glibc loader"; exit 1
          fi
          readelf -d grass.*.node | head -20

      # Rename .node file to include platform suffix
      - name: Rename artifact
        working-directory: crates/napi
        shell: bash
        run: |
          for f in *.node; do
            target="grass.${{ matrix.node-suffix }}.node"
            if [ "$f" != "$target" ]; then
              mv "$f" "$target"
            fi
          done

      - name: Test native module (x86_64 macOS under Rosetta 2)
        if: matrix.target == 'x86_64-apple-darwin'
        working-directory: crates/napi
        shell: bash
        run: |
          version="v24.14.0"
          archive="node-${version}-darwin-x64.tar.gz"
          # Node v24.14.0 darwin-x64 tarball; SHA-256 verified against the official SHASUMS256.txt.
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://nodejs.org/dist/${version}/$archive"
          echo "f2879eb810e25993a0578e5d878930266fd2eafcffe9f2839b3d8db354d4879e  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          arch -x86_64 "$RUNNER_TEMP/node-${version}-darwin-x64/bin/node" test.mjs

      - name: Test native module (aarch64 macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        working-directory: crates/napi
        run: node test.mjs

      - name: Test native module (x86_64 Linux GNU)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: crates/napi
        run: node test.mjs

      - name: Test native module (x86_64 Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: docker run --rm -v "$PWD:/w" -w /w/crates/napi node:24-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd node test.mjs

      - name: Test native module (aarch64 Linux GNU)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        working-directory: crates/napi
        run: node test.mjs

      - name: Test native module (aarch64 Linux musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: docker run --rm -v "$PWD:/w" -w /w/crates/napi node:24-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd node test.mjs

      - name: Test native module (x86_64 Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: crates/napi
        run: node test.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.node-suffix }}
          path: crates/napi/grass.${{ matrix.node-suffix }}.node
          if-no-files-found: error

  publish:
    name: Publish ihiutch-grass
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Install npm 11.18.0 (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@11.18.0 && npm --version

      - name: Build WASM
        run: |
          version=0.15.0
          archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLo "$archive" "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/$archive"
          # SHA-256 digest from the rustwasm/wasm-pack v0.15.0 GitHub release asset.
          echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  $archive" | sha256sum -c -
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 "$RUNNER_TEMP/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add wasm32-unknown-unknown
          cd crates/lib
          wasm-pack build --release --target web --out-name grass --no-default-features --features wasm-exports,random

      - name: Copy WASM artifacts to pkg-publish
        run: |
          cp crates/lib/pkg/grass_bg.wasm crates/lib/pkg-publish/
          cp crates/lib/pkg/grass_bg.wasm.d.ts crates/lib/pkg-publish/
          cp crates/lib/pkg/grass.d.ts crates/lib/pkg-publish/
          cp crates/lib/pkg/grass.js crates/lib/pkg-publish/

      - name: Download all native bindings
        uses: actions/download-artifact@v8
        with:
          path: native-artifacts

      - name: Copy native bindings to pkg-publish
        run: |
          for dir in native-artifacts/bindings-*/; do
            cp "$dir"/*.node crates/lib/pkg-publish/
          done
          echo "=== Package contents ==="
          ls -la crates/lib/pkg-publish/*.node crates/lib/pkg-publish/*.wasm

      - name: Smoke test package before publish
        working-directory: crates/lib/pkg-publish
        run: npm test

      - name: Publish
        working-directory: crates/lib/pkg-publish
        run: npm publish --provenance --access public

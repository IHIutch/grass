name: 'Build WebAssembly'

on:
  push:
    tags: [ '*' ]
      
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v7
        
    - name: 'Install wasm-pack'
      run: |
        version=0.15.0
        archive="wasm-pack-v${version}-x86_64-unknown-linux-musl.tar.gz"
        curl -fsSLo "$archive" "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${version}/$archive"
        # SHA-256 digest from the rustwasm/wasm-pack v0.15.0 GitHub release asset.
        echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  $archive" | sha256sum -c -
        tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP"
        mkdir -p "$HOME/.cargo/bin"
        install -m 0755 "$RUNNER_TEMP/wasm-pack" "$HOME/.cargo/bin/wasm-pack"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    
    - name: 'Build WebAssembly'
      run: |
        rustup target add wasm32-unknown-unknown
        pushd ./crates/lib
        wasm-pack build --release --target web --out-name index --no-default-features --features wasm-exports,random
        popd
        mkdir -p artifacts
        find crates/lib/pkg -type f \( -name "*.js" -o -name "*.d.ts" -o -name "*.wasm" \) -exec cp {} artifacts \;
        
    - name: 'Upload Artifacts'
      uses: actions/upload-artifact@v7
      with:
        name: 'wasm'
        path: artifacts/*


[package]
authors = ["Automatically generated"]
edition = "2021"
name = "grass-fuzz"
publish = false
version = "0.0.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.3"

[dependencies.grass]
path = "../crates/lib"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

